---
- name: Install required basic packages
  apt:
    name:
      - curl
      - git
      - ufw
      - build-essential
      - apt-transport-https
      - ca-certificates
      - fail2ban
      - unattended-upgrades
      - jq
    state: present
    update_cache: yes

- name: Ensure the app group exists
  group:
    name: "{{ app_group }}"
    state: present

- name: Ensure the app user exists
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    create_home: yes
    state: present

- name: Setup UFW firewall rules
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ ssh_port }}"
    - "80"
    - "443"

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny

- name: Enable fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes

- name: Enable unattended-upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'