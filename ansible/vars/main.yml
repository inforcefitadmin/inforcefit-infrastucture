---
# ==========================================
# System Settings
# ==========================================
ansible_python_interpreter: /usr/bin/python3

app_user: deploy
app_group: deploy

# ==========================================
# Node.js Settings
# ==========================================
nodejs_version: "20.x"

# ==========================================
# Environment: Production
# ==========================================
prod_pm2_name: "inforce-fit-prod"
prod_app_dir: "/var/www/inforcefit-server"
prod_app_port: 3000
prod_domain: "api.inforce.fit"    

# ==========================================
# Environment: Development
# ==========================================
dev_pm2_name: "inforce-fit-dev"
dev_app_dir: "/var/www/inforcefit-server-dev"
dev_app_port: 3001
dev_domain: "dev-api.inforce.fit"  

# ==========================================
# Monitoring ports (native install, matches current server)
# ==========================================
grafana_port: 3003
prometheus_port: 9090
loki_port: 3100

# ==========================================
# Security / auditd
# ==========================================
ssh_port: 24816   

# ==========================================
# Infisical
# ==========================================
infisical_domain: "https://app.infisical.com"
infisical_project_id: "d31e7d0e-37e1-4cab-9c54-c4496a33399a"
